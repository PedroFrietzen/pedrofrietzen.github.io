<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FTZEN - Em breve</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* BLOQUEIA SCROLL */
    }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Fredoka', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Fundo fixo */
    .bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, #1a0033, #000000);
      opacity: 0.7;
      filter: blur(100px);
      z-index: 1;
    }

    /* Container de partículas com CLIP */
    .particles {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2;
      overflow: hidden; /* Garante que nada vaze */
    }

    /* Container do conteúdo */
    .container {
      text-align: center;
      z-index: 10;
      position: relative;
      padding: 20px;
      width: 90%;
      max-width: 800px;
    }

    /* <FTZEN/> */
    .logo-text {
      font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 900;
      color: #000;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
      position: relative;
      display: inline-block;

      text-shadow: 
        0 0 20px #ff6b35,
        0 0 40px #ff6b35,
        0 0 60px #ff6b35,
        0 0 90px #ff6b35;

      filter: blur(0.4px);
      -webkit-font-smoothing: antialiased;
    }

    .logo-text::before {
      content: '<FTZEN/>';
      position: absolute;
      top: 0; left: 0;
      color: transparent;
      -webkit-text-stroke: clamp(1.5px, 0.5vw, 3px) #ff6b35;
      filter: blur(4px);
      z-index: -1;
    }

    /* EM BREVE */
    .soon-text {
      font-size: clamp(2.2rem, 8vw, 5rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ff6b35, #00c2ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 0.15em;
      margin-bottom: 0.8rem;

      text-shadow: 
        0 0 25px rgba(255,107,53,0.6),
        0 0 50px rgba(0,194,255,0.4);

      filter: blur(0.3px);
    }

    .subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1.4rem);
      color: #ddd;
      letter-spacing: 0.2em;
      font-weight: 600;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255,255,255,0.2);
    }

    /* PARTÍCULAS CONFINADAS NA TELA */
    .particle {
      position: absolute;
      background: radial-gradient(circle, rgba(255,107,53,0.75), transparent 70%);
      border-radius: 50%;
      filter: blur(1.8px);
      opacity: 0;
      /* Movimento limitado: só dentro da viewport */
      animation: floatParticle linear infinite;
    }

    .particle.blue {
      background: radial-gradient(circle, rgba(0,194,255,0.75), transparent 70%);
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(100vh) translateX(0) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.7; }
      90% { opacity: 0.7; }
      100% {
        transform: translateY(-100px) translateX(0) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <!-- Container de partículas com overflow hidden -->
  <div class="particles" id="particles"></div>

  <div class="container">
    <h1 class="logo-text">&lt;FTZEN/&gt;</h1>
    <h2 class="soon-text">EM BREVE</h2>
    <p class="subtitle">Algo incrível está chegando...</p>
  </div>

  <script>
    const container = document.getElementById('particles');
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;

    function createParticle() {
      const p = document.createElement('div');
      p.classList.add('particle');

      // Tamanho responsivo
      const baseSize = viewportWidth < 768 ? 6 : 9;
      const size = Math.random() * baseSize + 4;
      p.style.width = p.style.height = `${size}px`;

      // Posição inicial: apenas na parte inferior da tela
      p.style.left = `${Math.random() * 100}vw`;
      p.style.bottom = `-${size}px`; /* Começa fora, mas dentro do container */

      const duration = Math.random() * 18 + 15;
      const delay = Math.random() * 5;
      p.style.animation = `floatParticle ${duration}s linear ${delay}s infinite`;

      if (Math.random() > 0.5) p.classList.add('blue');

      container.appendChild(p);

      // Remove após animação
      setTimeout(() => p.remove(), (duration + delay) * 1000);
    }

    // Cria partículas
    setInterval(createParticle, 250);
    for (let i = 0; i < 20; i++) {
      setTimeout(createParticle, i * 200);
    }

    // Recria ao redimensionar
    window.addEventListener('resize', () => {
      clearInterval(window.particleInterval);
      container.innerHTML = '';
      for (let i = 0; i < 15; i++) {
        setTimeout(createParticle, i * 150);
      }
    });
  </script>
</body>
</html>
