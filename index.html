<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FTZEN - Em Breve</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #FF6B35;
      --dark-blue: #0A2647;
      --light-gray: #f5f5f5;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--dark-blue) 0%, #0f3460 100%);
      color: var(--white);
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      text-align: center;
      z-index: 10;
      max-width: 900px;
      padding: 2rem;
    }

    .logo {
      font-size: 4.5rem;
      font-weight: 900;
      color: var(--orange);
      margin-bottom: 1rem;
      letter-spacing: 0.1em;
      text-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
    }

    .coming-soon {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--white);
    }

    .subtitle {
      font-size: 1.3rem;
      margin-bottom: 2.5rem;
      color: rgba(255, 255, 255, 0.8);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    .email-form {
      display: flex;
      justify-content: center;
      gap: 1rem;
      max-width: 500px;
      margin: 0 auto 2rem;
      flex-wrap: wrap;
    }

    .email-input {
      padding: 1rem 1.5rem;
      font-size: 1.1rem;
      border: none;
      border-radius: 50px;
      flex: 1;
      min-width: 250px;
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      backdrop-filter: blur(10px);
    }

    .email-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .notify-btn {
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      background: var(--orange);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
    }

    .notify-btn:hover {
      background: #e55a2b;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 107, 53, 0.5);
    }

    @media (max-width: 768px) {
      .coming-soon {
        font-size: 2.5rem;
      }
      .logo {
        font-size: 3.5rem;
      }
      .email-form {
        flex-direction: column;
        align-items: center;
      }
      .email-input, .notify-btn {
        width: 100%;
        max-width: 300px;
      }
    }

    /* Bolhas flutuantes - mais suaves */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 107, 53, 0.08);
      pointer-events: none;
      animation: float 12s infinite ease-in-out;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 107, 53, 0.15);
      opacity: 0.7;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0) rotate(0deg); }
      33% { transform: translateY(-30px) translateX(15px) rotate(3deg); }
      66% { transform: translateY(-15px) translateX(-20px) rotate(-2deg); }
      100% { transform: translateY(0) translateX(0) rotate(0deg); }
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="container">
    <h1 class="logo">FTZEN</h1>
    <h2 class="coming-soon">Em Breve...</h2>
    <p class="subtitle">
      Estamos trabalhando em algo incrível. Inscreva-se para ser o primeiro a saber quando lançarmos.
    </p>

    <form class="email-form" onsubmit="alert('Obrigado! Você será notificado em breve.'); return false;">
      <input type="email" class="email-input" placeholder="Seu e-mail" required />
      <button type="submit" class="notify-btn">Avise-me</button>
    </form>
  </div>

  <script>
    // Partículas com Canvas - mais lentas e suaves
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    const mouse = { x: 0, y: 0 };

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + 30;
        this.size = Math.random() * 4 + 1.5; // menor e mais delicado
        this.speedX = Math.random() * 0.6 - 0.3; // muito mais lento
        this.speedY = Math.random() * -1.2 - 0.5; // sobe devagar
        this.life = 0;
        this.maxLife = Math.random() * 200 + 200; // vive mais
        this.opacity = 1;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life++;
        this.opacity = 1 - (this.life / this.maxLife);

        // Interação suave com o mouse
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < 120) {
          const force = (120 - distance) / 120;
          this.speedX += (dx * force) * 0.00008;
          this.speedY += (dy * force) * 0.00008;
        }

        // Movimento de flutuação natural
        this.speedX += Math.sin(this.life * 0.02) * 0.02;
      }

      draw() {
        ctx.fillStyle = `rgba(255, 107, 53, ${this.opacity * 0.6})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < 60; i++) { // menos partículas para mais leveza
        particles.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        p.update();
        p.draw();
        if (p.life > p.maxLife || p.y < -50) {
          particles[i] = new Particle();
        }
      });
      requestAnimationFrame(animate);
    }

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
    });

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    });

    // Bolhas flutuantes - mais suaves e espaçadas
    function createBubble() {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');
      const size = Math.random() * 70 + 25;
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.left = `${Math.random() * 100}vw`;
      bubble.style.top = `${Math.random() * 100}vh`;
      bubble.style.animationDuration = `${Math.random() * 10 + 12}s`; // mais lento
      bubble.style.animationDelay = `${Math.random() * 8}s`;
      document.body.appendChild(bubble);

      setTimeout(() => {
        if (bubble.parentElement) bubble.remove();
      }, 22000);
    }

    // Criar bolhas com menos frequência
    setInterval(createBubble, 3000); // a cada 3 segundos

    // Iniciar
    initParticles();
    animate();

    // Bolhas iniciais espaçadas
    for (let i = 0; i < 5; i++) {
      setTimeout(createBubble, i * 1500);
    }
  </script>
</body>
</html>
